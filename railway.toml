[build]
# Use the Dockerfile in the DoTogether sub-folder.
# The build context is the repository root so all .csproj files are reachable.
builder       = "DOCKERFILE"
dockerfilePath = "DoTogether/Dockerfile"

[deploy]
restartPolicyType    = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Non-secret environment variables.
# JWT__KEY must be set as a secret variable in the Railway dashboard (32+ chars).
[deploy.envVars]
ASPNETCORE_ENVIRONMENT = "Production"
ASPNETCORE_URLS        = "http://0.0.0.0:${{PORT}}"
Jwt__Issuer            = "DoTogether"
Jwt__Audience          = "DoTogether"
